services:
  - type: web
    name: online-examination-system-cbt
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn exam_config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: online-examination-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: online-examination-system-cbt.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://online-examination-system-cbt.onrender.com

databases:
  - name: online-examination-db
    databaseName: online_examination
    user: exam_admin
