
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="d-flex justify-content-between mb-4">
        <h2>School Classes</h2>
        <a href="{% url 'class_create' %}" class="btn btn-primary">
            + Add Class
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Class Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>
                    {% for school_class in classes %}
                    <tr>
                        <td>{{ school_class.name }}</td>
                        <td>{{ school_class.description|default:"-" }}</td>
                        <td>
                            <a href="{% url 'class_edit' school_class.pk %}"
                               class="btn btn-sm btn-warning">Edit</a>

                            <a href="{% url 'class_delete' school_class.pk %}"
                               class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">
                            No classes created yet.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <a href="{% url 'subject_list' %}" class="btn btn-success mt-4">
        Manage Subjects
    </a>

    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary mt-4">
        Back to Dashboard
    </a>
</div>

</body>
</html>
