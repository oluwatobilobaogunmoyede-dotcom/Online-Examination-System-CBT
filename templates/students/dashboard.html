<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2>Student Dashboard</h2>
    <p>Welcome, {{ request.user.username }}!</p>

    <div class="row g-4 mt-3">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>Available Exams</h5>
                <p>View examinations available to you.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>Take Examination</h5>
                <p>Start an online examination.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>My Results</h5>
                <p>View your examination results.</p>
            </div>
        </div>
    </div>

    <a href="{% url 'logout' %}" class="btn btn-danger mt-4">Logout</a>
    <a href="{% url 'available_examinations' %}"
         class="btn btn-primary">
        <i class="bi bi-pencil-square"></i>
             Available Examinations
    </a>
</div>

</body>
</html>
