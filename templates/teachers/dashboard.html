
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2>Teacher Dashboard</h2>
    <p>Welcome, {{ request.user.username }}!</p>

    <div class="row g-4 mt-3">
        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>Manage Questions</h5>
                <p>Create and manage examination questions.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>Manage Exams</h5>
                <p>Create and manage examinations.</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4 shadow-sm">
                <h5>View Results</h5>
                <p>Check students' examination results.</p>
            </div>
        </div>
    </div>

    <a href="{% url 'logout' %}" class="btn btn-danger mt-4">Logout</a>

    <a href="{% url 'examination_list' %}" class="btn btn-primary">
        Manage Examinations
    </a>

    <a href="{% url 'question_list' %}" class="btn btn-primary">
        Manage Questions
    </a>

</div>

</body>
</html>
